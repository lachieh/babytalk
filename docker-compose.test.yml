services:
  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: bubsie
      POSTGRES_USER: bubsie
      POSTGRES_PASSWORD: bubsie
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bubsie"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: bubsie-api:latest
    ports:
      - "4000:4000"
    environment:
      BUBSIE_API_DATABASE_URL: postgresql://bubsie:bubsie@postgres:5432/bubsie
      BUBSIE_API_JWT_SECRET: test-secret-do-not-use-in-production
      BUBSIE_API_SMTP_HOST: mailpit
      BUBSIE_API_SMTP_PORT: "1025"
      BUBSIE_API_SMTP_FROM: noreply@localhost
      BUBSIE_API_WEB_URL: http://localhost:3000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/readyz').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: bubsie-web:latest
    ports:
      - "3000:3000"
    environment:
      # Read by the browser via /.well-known/config, so use the host-mapped port.
      BUBSIE_WEB_API_URL: http://localhost:4000/graphql
      BUBSIE_WEB_TAMBO_URL: https://api.tambo.co
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/livez').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      api:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

volumes:
  pgdata:
